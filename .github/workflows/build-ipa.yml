name: Build HiPDA IPA

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications/ | grep -i xcode
          if [ -d "/Applications/Xcode_15.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.2.app
          fi
          xcodebuild -version

      - name: Pod install
        run: |
          sudo gem install cocoapods -v 1.15.2 --no-document
          pod --version
          pod install
          xcodebuild -project Pods/Pods.xcodeproj -list

      - name: Build Pods static lib (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Pods/Pods.xcodeproj -target Pods-HiPDA \
            -configuration Release -sdk iphoneos SYMROOT="$(pwd)/out" BUILD_DIR="$(pwd)/out" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee pods.log | tail -80

      - name: Build HiPDA app (unsigned)
        run: |
          set -o pipefail
          echo "=== xcconfig diagnostics ==="
          ls Pods/Target\ Support\ Files/Pods-HiPDA/ 2>/dev/null | head -10
          cat Pods/Target\ Support\ Files/Pods-HiPDA/Pods-HiPDA.release.xcconfig 2>/dev/null | head -10
          grep -c baseConfigurationReference HiPDA.xcodeproj/project.pbxproj
          echo "=== Building app target ==="
          xcodebuild -project HiPDA.xcodeproj -target HiPDA \
            -configuration Release -sdk iphoneos SYMROOT="$(pwd)/out" BUILD_DIR="$(pwd)/out" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            PRODUCT_BUNDLE_IDENTIFIER=wujichao.HiPDA2 \
            OTHER_CFLAGS='$(inherited) -Wno-error=implicit-function-declaration -Wno-error=incompatible-function-pointer-types -Wno-error=incompatible-pointer-types -Wno-error=int-conversion -Wno-error=implicit-int -Wno-error=return-type -Wno-error=deprecated-non-prototype -Wno-error=enum-constexpr-conversion -Wno-error=deprecated-declarations' \
            2>&1 | tee build.log | tail -120

      - name: Dump crash reports on failure
        if: failure()
        run: |
          find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports -name "*.ips" -mmin -15 2>/dev/null | head -5 || true
          for f in $(find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports -name "xcodebuild*.ips" -mmin -15 2>/dev/null | head -1); do
            echo "=== crash report: $f ==="
            head -c 6000 "$f"
          done

      - name: Package IPA
        if: success()
        run: |
          APP_PATH=$(find "$(pwd)/out" -type d -name "*.app" -not -path "*Pods*" 2>/dev/null | head -1)
          echo "App: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry HiPDA-unsigned.ipa Payload
          ls -lh HiPDA-unsigned.ipa

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HiPDA-unsigned-ipa
          path: HiPDA-unsigned.ipa

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            pods.log
