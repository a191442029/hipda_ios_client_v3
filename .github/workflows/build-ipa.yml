name: Build HiPDA IPA

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications/ | grep -i xcode
          if [ -d "/Applications/Xcode_15.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.2.app
          fi
          xcodebuild -version

      - name: Pod install
        run: |
          sudo gem install cocoapods -v 1.15.2 --no-document
          pod --version
          grep -m1 objectVersion HiPDA.xcodeproj/project.pbxproj
          pod install
          grep -m1 objectVersion Pods/Pods.xcodeproj/project.pbxproj

      - name: Diagnose xcodebuild crash
        run: |
          set +e
          echo "=== A: workspace+scheme list ==="
          xcodebuild -workspace HiPDA.xcworkspace -scheme HiPDA -list 2>&1 | tail -10
          echo "EXITA=$?"
          echo "=== B: scheme dry-run ==="
          xcodebuild -workspace HiPDA.xcworkspace -scheme HiPDA -configuration Release -sdk iphoneos -dry-run 2>&1 | tail -10
          echo "EXITB=$?"
          echo "=== C: full minus OTHER_CFLAGS ==="
          xcodebuild -workspace HiPDA.xcworkspace -scheme HiPDA -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" IPHONEOS_DEPLOYMENT_TARGET=12.0 GCC_TREAT_WARNINGS_AS_ERRORS=NO -dry-run 2>&1 | tail -10
          echo "EXITC=$?"
          echo "=== D: full minus signing flags ==="
          xcodebuild -workspace HiPDA.xcworkspace -scheme HiPDA -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build ARCHS=arm64 IPHONEOS_DEPLOYMENT_TARGET=12.0 -dry-run 2>&1 | tail -10
          echo "EXITD=$?"

      - name: Build unsigned IPA (arm64)
        run: |
          set -o pipefail
          xcodebuild -workspace HiPDA.xcworkspace \
            -scheme HiPDA \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            OTHER_CFLAGS='$(inherited) -Wno-error=implicit-function-declaration -Wno-error=incompatible-function-pointer-types -Wno-error=incompatible-pointer-types -Wno-error=int-conversion -Wno-error=implicit-int -Wno-error=return-type -Wno-error=deprecated-non-prototype -Wno-error=enum-constexpr-conversion -Wno-error=deprecated-declarations' \
            2>&1 | tee build.log | tail -100

      - name: Package IPA
        if: success()
        run: |
          APP_PATH=$(find build/Build/Products -type d -name "*.app" | head -1)
          echo "App: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry HiPDA-unsigned.ipa Payload
          ls -lh HiPDA-unsigned.ipa

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HiPDA-unsigned-ipa
          path: HiPDA-unsigned.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
